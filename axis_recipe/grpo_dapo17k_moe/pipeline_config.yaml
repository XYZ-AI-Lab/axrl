controller:
    run_mode: online_rl_train
    output_dir_name: grpo-dapo17k-moe
    colocated: true
    num_rollout_actors: 16
    num_cpus_per_actor: 4
    max_running_requests: 2048
    smoke_eval_rollouts: null
    save_eval_rollouts: true
    allow_prefix_merging: true
eval_only:
    model: null
megatron_worker:
    model:
        name: Qwen/Qwen3-30B-A3B-Base
        trust_remote_code: true
        seq_length: 16384
    seed: 42
    tp_size: 8
    pp_size: 1
    vpp_size: null
    dp_size: 1
    cp_size: 1
    ep_size: 8
    etp_size: 1
    enable_routing_replay: false
    replay_routing_for_loss_tokens_only: false
    fp8: null
    fp8_recipe: blockwise
    data_loader:
        num_workers: 4
    padding_sample_length: 4
    train_micro_batch_size: 2
    eval_micro_batch_size: 4
    global_batch_size: 512
    use_dynamic_batch_size: true
    num_epochs: 100
    moe_aux_loss_coeff: 0
    moe_router_load_balancing_type: none
    recompute_granularity: full
    recompute_method: uniform
    recompute_num_layers: 1
    recompute_modules: null
    cpu_offloading: false
    cpu_offloading_num_layers: 0
    cpu_offloading_double_buffering: false
    log_every_k_steps: 1
    checkpoint_dir: checkpoints/megatron
    checkpoint_step: null
    most_recent_checkpoint_k: 2
    save_hf_checkpoint: false
    reset_init_weights_every_k_steps: null
    log_microbatches: false
    log_gpu_usaegs: true
    metric_logger_config:
        logger_type: console
        name: main-process
        group_name: default_group
        project_name: axrl
        run_id: null
    log_level: info
    fp16: false
    bf16: true
    use_gloo_process_groups: true
    apply_rope_fusion: true
    attention_backend: flash
    deterministic_mode: true
    batch_invariant_mode: false
    spike_debug:
        enabled: false
        warmup_steps: 10
        spike_ratio: 5.0
        history_window: 100
        max_snapshots: 3
        save_per_param_grads: true
    optimizer:
        optimizer: adam
        lr: 1.0e-06
        min_lr: 1.0e-07
        weight_decay: 0.1
        use_distributed_optimizer: true
        clip_grad: 1.0
        fp16: false
        bf16: true
        adam_beta1: 0.9
        adam_beta2: 0.999
        optimizer_cpu_offload: true
        optimizer_offload_fraction: 1.0
    lr_scheduler:
        init_lr: 1.0e-07
        max_lr: 1.0e-06
        min_lr: 1.0e-06
        lr_warmup_steps: 40
        lr_decay_steps: 1000000
        lr_decay_style: constant
        start_wd: 0.1
        end_wd: 0.1
        wd_incr_steps: 1000000
        wd_incr_style: constant
        use_checkpoint_opt_param_scheduler: true
        override_opt_param_scheduler: false
        wsd_decay_steps: null
        lr_wsd_decay_style: null
    num_dataloader_workers: 0
    inference_only: false
    shuffle_train_data: false
    enable_fp32_lm_head: false
    use_magi_merged_forward: false
    use_magi_flat_forward: false
rollout_worker:
    name: default-worker
    engine_type: sglang
    model:
        name: Qwen/Qwen3-30B-A3B-Base
        trust_remote_code: true
        seq_length: 16384
    sampling_config:
        temperature: 1.0
        top_p: 1.0
        top_k: -1
        min_p: 0.0
        frequency_penalty: 0.0
        presence_penalty: 0.0
        repetition_penalty: 1.0
        max_total_tokens: 16384
        max_new_tokens: null
        stop: null
    gpu_memory_utilization: 0.7
    dp_size: 1
    tp_size: 4
    pp_size: 1
    ep_size: 4
    moe_a2a_backend: none
    moe_runner_backend: null
    enable_routing_replay: false
    num_workers: 2
    clear_partial_outputs_after_abort: false
    continue_generation_after_abort: true
    log_level: info
    max_running_requests: 2048
    max_running_requests_eval: null
    max_num_batched_tokens: 32768
    load_dummy_weights: false
    attention_backend: null
    kv_cache_dtype: auto
    prefill_max_requests: null
    enable_fp32_lm_head: true
    enable_metrics: true
    dtype: auto
    master_addr: 127.0.0.1
    master_port: 20250
    nnodes: 1
    node_rank: 0
    max_imbalance: 16
train_datasets:
-   name: BytedTsinghua-SIA/DAPO-Math-17k
    data_path: null
    eval_num_rollouts_per_prompt: null
    subset_key: null
test_datasets:
-   name: BytedTsinghua-SIA/AIME-2024
    data_path: null
    eval_num_rollouts_per_prompt: 64
    subset_key: null
eval_sampling_config:
    temperature: 0.7
    top_p: 0.9
    top_k: -1
    min_p: 0.0
    frequency_penalty: 0.0
    presence_penalty: 0.0
    repetition_penalty: 1.0
    max_total_tokens: 16384
    max_new_tokens: null
    stop: null
train_sampling_config:
    temperature: 1.0
    top_p: 1.0
    top_k: -1
    min_p: 0.0
    frequency_penalty: 0.0
    presence_penalty: 0.0
    repetition_penalty: 1.0
    max_total_tokens: 16384
    max_new_tokens: null
    stop: null
grpo:
    loss_type: grpo
    clip_ratio_high: 0.28
    clip_ratio_low: 0.2
    dual_clip_neg_adv_factor: 10.0
    dual_soft_clip: 3.0
    log_sample: true
    normalize_advantage_by_batch_std: false
    loss_agg_type: token-mean
    micro_batch_denominator_type: sequence
    entropy_control:
        target_entropy: 0.1
        alpha: 0.0
        top_k: -1
        top_quantile: 1.0
        easy_score_cutoff: 0.4
        epsilon: 1.0e-06
    kl_control_alpha: 0.0
    is_base_logprobs: old_logprobs
    kl_base_logprobs: old_logprobs
    mismatch_token_clip_max: null
    mismatch_seq_masking_low: null
    mismatch_seq_masking_high: null
    mismatch_token_veto_threshold: null
    icepop_masking_low: null
    icepop_masking_high: null
    turn_reward_alpha: 0.0
    seq_turn_alpha: null
sft:
    compute_accuracy: false
    compute_entropy: false
online_rl_train:
    eval_on_start: true
    num_rollouts_per_conversation: 8
    model_sync_every_n_global_updates: 4
    checkpoint_every_n_global_updates: 1024
    eval_every_n_global_updates: 64
    batch_rollout_for_n_global_updates: 4
    max_global_updates: 30000
    strict_on_policy: false
    reward_mean_type: group
    reward_std_type: group
    reward_history_size: 64
    sample_type: uniform
    filter_zero_std: false
    max_prompt_length: null
    sort_sampled_prompts_by_response_length: true
    rollout_save_filename: dapo17k-moe
    rollout_save_every_n_global_updates: null
    save_all_rollouts: false
replay_rl_train:
    sample_dict_path: null
    rollout_groups_path: null
mismatch_test:
    enabled: false
    name: cur-exp
    output_dir: tmp/mismatch-test
    override_rollouts_if_exists: false
    baseline_samples_path: null
    baseline_name: null
logger:
    logger_type: tensorboard
    name: main-process
    group_name: GRPO-DAPO17k-Experiment
    project_name: dapo17K-moe
    run_id: null
