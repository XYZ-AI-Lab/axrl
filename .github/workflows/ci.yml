name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff==0.14.11
      - name: Run Ruff
        run: ruff check .

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run ShellCheck
        shell: bash
        run: |
          mapfile -d '' scripts < <(find axis_recipe benchmark scripts -type f -name '*.sh' -print0)
          if ((${#scripts[@]} == 0)); then
            echo "No shell scripts found."
            exit 0
          fi
          shellcheck "${scripts[@]}"
